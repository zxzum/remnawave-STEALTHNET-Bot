      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap&subset=latin,cyrillic"
      rel="stylesheet"
    />
    <title>Лазейка VPN</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Старый Service Worker может отдать HTML предыдущего релиза со ссылками
      // на уже удалённые JS-файлы, поэтому удаляем его до запуска приложения.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          if (!regs.length) return;
          Promise.all(regs.map(function(r) { return r.unregister(); }))
            .then(function() { location.reload(); });
        });
      }
    </script>
    <script src="/telegram-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
